<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Lora:wght@600&family=Poppins:wght@400;500&family=JetBrains+Mono:wght@500&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  width: 1200px;
  height: 630px;
  background: linear-gradient(135deg, #14251F 0%, #1E3A30 100%);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-family: 'Poppins', sans-serif;
}

.mark {
  display: flex;
  align-items: center;
  gap: 28px;
  margin-bottom: 40px;
}

.wordmark {
  display: flex;
  flex-direction: column;
  line-height: 1;
}

.name {
  font-family: 'Lora', serif;
  font-weight: 600;
  font-size: 64px;
  color: #FDFDFB;
}

.sub {
  font-family: 'JetBrains Mono', monospace;
  font-weight: 500;
  font-size: 22px;
  letter-spacing: 6px;
  color: #8FB5A9;
  margin-top: 12px;
}

.tagline {
  font-size: 24px;
  color: rgba(253, 253, 251, 0.75);
  max-width: 820px;
  text-align: center;
}
</style>
</head>
<body>
  <div class="mark">
    <svg viewBox="0 0 100 100" width="90" height="90">
      <path d="M8 55 L18 40 L24 68 L30 35 L36 60 L42 50 L46 55" fill="none" stroke="#8FB5A9" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M54 55 C64 55 66 30 76 30 C84 30 86 55 92 55" fill="none" stroke="#2FA88A" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="50" cy="55" r="7" fill="#FDFDFB"/>
    </svg>
    <div class="wordmark">
      <div class="name">Concordance</div>
      <div class="sub">HEALTH AI</div>
    </div>
  </div>
  <div class="tagline">From concept to a deployed, validated AI health system.</div>
</body>
</html>
